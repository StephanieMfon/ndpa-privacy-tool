[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndpa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pyyaml", "tldextract", "playwright", "spacy>=3.8", "fastapi", "uvicorn", "jinja2", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.17,<0.18", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/spikes"]  # kept as evidence of how the tracker list was chosen; not maintained code

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4"]
# B008: FastAPI's Depends(...) and Query(...) in a function signature is the framework's own idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
markers = ["browser: needs a real browser"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient"]

[tool.setuptools.package-data]
ndpa = ["web/templates/*.html", "web/static/*", "capture/*.js"]
