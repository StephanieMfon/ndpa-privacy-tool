# rulebook/rules.v2.yaml  (DRAFT 2: mirrors Annotation Rulebook v2.0 PDF, 29 Oct 2026)
meta:
  version: "2.0.0-draft2"
  source_of_truth: "Annotation_Rulebook_v2.0.pdf"
  frozen: false
  outcomes: [compliant, non_compliant, not_applicable, unable_to_determine]
  tool_only_outcome: "unable_to_determine is used by the tool only (blocked scan, failed run, uncertain policy discovery). Annotators use the 3 PDF labels."
  tiers:
    {
      critical: "Observed processing without or against consent",
      major: "Consent or transparency mechanism missing or defective",
      minor: "Hygiene and completeness",
    }

definitions:
  necessary_cookie: "Per PDF 0.2 and register R1 (GAID Art 19(5)-(6)). Unknown purpose = non-necessary."
  consent_trigger: "At least one non-necessary cookie is set OR one TR-01 tracker loads, in any run"
  first_party: "Same registrable domain, or shown to belong to the same operator (R2)"
  disclosures: "Banner text, preference panel, Cookie Policy, Privacy Policy, and pages they link to directly, reachable within two clicks of the homepage"
  consent_action_types: [accept, reject, close, none]

capture_runs:
  run1: "No interaction. Feeds CN-01, CN-02, TR-01, SB-01 to SB-03"
  run2: "Reject (only if a Reject control exists). Feeds CN-02, SB-01 to SB-03"
  run3: "Accept. Feeds CN-04, CN-05"
  note: "Each run uses a fresh browser context. Record the consent action type for every run."

conventions: # PDF 0.6
  no_cookies: "CK-01, CK-02 = not_applicable ('no cookies')"
  no_consent_trigger: "CN-01 to CN-05 = not_applicable ('no consent trigger'). SB-01 to SB-03 = not_applicable by their own rules."
  trigger_but_no_mechanism: "CN-01 = non_compliant. CN-02 scored from the timeline. CN-03 = non_compliant. CN-04, CN-05 = not_applicable."
  blocked_scan: "Tool only: no score and no rule outcomes, status 'blocked' (D-35)"
  policy_not_found: "Tool convention (D-34). PP-01 = non_compliant. If discovery was exhaustive and negative, the rules that need policy text (CK-01, CK-02, TR-02, PP-02 to PP-06) = non_compliant tagged 'root cause: PP-01'. If discovery was uncertain (block, timeout, JS-rendered), they = unable_to_determine."

registers: # PDF Appendix A
  R1:
    {
      used_by: "0.2, CN-02, SB-02",
      value: "Starter list in rulebook/necessary_cookies.yaml, confirmed in the pilot, then frozen. A cookie not on the list with no documented purpose = non-necessary, flagged 'purpose unknown'.",
    }
  R2:
    {
      used_by: "0.2, CK-02",
      value: "Common ownership shown in the site's own disclosures or a public company record",
    }
  R3:
    {
      used_by: CK-01,
      value: "12 months (365 days). Methodological, not statutory.",
    }
  R4:
    {
      used_by: CN-01,
      value: "Grid method. Cut the first-paint viewport screenshot into a 3x3 grid. 'Significantly obstructs' = the banner box covers at least 1/9 of the viewport AND is not entirely inside the bottom row. Measure the banner box, not any dimmed backdrop. Positions recorded: bottom, top, centre_modal, left, right, full_screen. Methodological threshold, not statutory.",
    }
  R5:
    {
      used_by: CN-02,
      value: "Close = implied consent only as stated in CN-02. Report strict and implied readings.",
    }
  R6:
    {
      used_by: "0.4",
      value: "Chrome stable (version recorded per capture day), desktop viewport 1366x768, fresh named profile, no extensions, NOT Incognito, network location Nigeria, language en-NG.",
    }
  R7:
    {
      used_by: "0.4",
      value: "10 seconds after page load finishes, no interaction. Same 10 seconds after an Accept or Reject click.",
    }
  R8:
    {
      used_by: TR-01,
      value: "Frozen DuckDuckGo blocklist snapshot (data/lists/tds-snapshot.json, hash in FREEZE.json). A third-party request is a tracker if its domain is in the list AND either the list's default for that domain is 'block' or the request URL matches one of that domain's URL rules (a matching rule marked 'ignore' means not a tracker). Annotators run eval/is_tracker.py on the HAR file; the tool uses the same code.",
    }
  R9:
    {
      used_by: TR-02,
      value: "Vendor or product name required. Category-only does not count.",
    }
  R10:
    {
      used_by: SB-01,
      value: "'Active' = outbound request to a non-first-party tracker, or writes a cookie or local-storage value. Dormant = not_applicable.",
    }
  R11:
    {
      used_by: "PP-01, PP-02",
      value: "Policy inside Terms counts if under its own heading about privacy or personal data",
    }
  R12:
    {
      used_by: PP-03,
      value: "Generic contact form does not count unless it states it covers privacy",
    }
  R13:
    {
      used_by: PP-04,
      value: "Purpose must name the data category and the specific use",
    }

rules:
  # ---------------- A. COOKIES ----------------
  - id: CK-01
    name: Persistent cookie lifespan proportionate
    category: cookies
    tier: minor
    weight: 1
    basis: direct_stated_reading
    legal:
      [
        "NDPA s.24(1)(d)",
        "GAID Sch 1 para 4(iii),(vii)",
        "GAID Art 49(3) (context only, not a cookie cap)",
      ]
    # thresholds: { max_days: 365, register: R3 }

    thresholds:
      {
        min_coverage: 0.111,
        bottom_row_starts_at: 0.667,
        register: R4,
        positions_recorded:
          [bottom, top, centre_modal, left, right, full_screen],
      }
    decision:
      non_compliant: "A persistent cookie lasts longer than max_days and no justification appears in the disclosures"
      compliant: "No persistent cookie exceeds max_days, or each one that does is justified"
      not_applicable: "Only session cookies, or no cookies"
    instance_unit: cookie
    evidence: [cookie_name, lifespan_days, matched_text_or_none]
    remediation:
      fix: "Shorten the cookie lifetime to 12 months or less, or state its lifetime and purpose in the cookie policy."
      clause: "NDPA s.24(1)(d); GAID Sch 1 para 4"

  - id: CK-02
    name: Third-party cookie recipient disclosed
    category: cookies
    tier: major
    weight: 2
    basis: direct_stated_reading
    legal: ["GAID Art 19(7)(d)", "GAID Art 27(3)(f)-(g)"]
    stated_reading: "'Organisation responsible' = the company operating the cookie's domain, named by company or product name"
    decision:
      non_compliant: "A third-party cookie exists and its organisation is not named in the disclosures"
      compliant: "Every third-party cookie's organisation is named"
      not_applicable: "No third-party cookies"
    instance_unit: cookie_owner
    evidence: [cookie_name, cookie_domain, owner, matched_text_or_none]
    edge_cases:
      [
        "Domains of the site operator (R2) are first-party and outside this rule",
      ]
    remediation:
      fix: "Name each third-party cookie provider and its purpose in the cookie policy, or remove the cookie."
      clause: "GAID Art 19(7)(d), 27(3)(f)-(g)"

  # ---------------- B. CONSENT ----------------
  - id: CN-01
    name: Consent banner present and conspicuous
    category: consent
    tier: major
    weight: 2
    basis: direct
    legal: ["GAID Art 7(l)", "GAID Art 19(4), 19(7)(a)"]
    thresholds:
      {
        coverage_measure: "OPEN (R4)",
        positions_recorded:
          [bottom, top, centre_modal, left, right, full_screen],
      }
    decision:
      non_compliant: "No notice at first paint before non-necessary cookies are set, OR the notice is confined to the bottom of the viewport, OR it fails the R4 obstruction test"
      compliant: "Notice at first paint, before non-necessary cookies, and it significantly obstructs the middle, left or right (R4)"
      not_applicable: "No consent trigger"
    instance_unit: site
    evidence: [screenshot, banner_position, measured_coverage]
    edge_cases:
      - "A banner that appears only after a scroll or click is non_compliant"
      - "Top-edge banners are judged by the same R4 test and tallied separately"
    remediation:
      fix: "Show the banner on first paint, centred or at the left or right edge, never as a bottom strip."
      clause: "GAID Art 7(l), 19(4), 19(7)(a)"

  - id: CN-02
    name: Consent before non-necessary cookies
    category: consent
    tier: critical
    weight: 1.5 # shares 3 points with SB-02 (overlap pair)
    pair: cookie_pair
    basis: direct_stated_reading
    legal:
      ["GAID Art 19(2)-(3), 19(5)-(6), 17(8)(b)", "NDPA s.26(3), s.26(7)(a)"]
    decision:
      non_compliant: "A non-necessary cookie is created (a) before an affirmative consent action, including all of Run 1, or (b) after Reject in Run 2"
      compliant: "Consent trigger exists and no non-necessary cookie is created in either case"
      not_applicable: "No consent trigger. Necessary cookies are never scored."
    close_handling: "Close counts as implied consent only if the banner passed CN-01's obstruction test, and only for first-party cookies whose purpose is site functionality or first-party interaction analytics. Never for advertising, cross-site or third-party cookies. Report results under both the strict reading (Close is not consent) and this reading (R5)."
    instance_unit: cookie
    evidence:
      [
        cookie_name,
        domain,
        t_ms,
        run,
        consent_action_type,
        purpose_unknown_flag,
      ]
    edge_cases:
      - "CMP consent-pending and consent-state cookies are Necessary"
      - "Cookies from a pre-selected category saved without the visitor choosing it are non_compliant (NDPA s.26(7)(a))"
      - "Cookies only. Storage items are recorded as evidence but not scored here."
    remediation:
      fix: "Set the CMP to block non-necessary tags until consent, and make Reject actually stop them. Remove hard-coded analytics or ad tags."
      clause: "GAID Art 19(2)-(3); NDPA s.26(3), 26(7)(a)"

  - id: CN-03
    name: Reject option available
    category: consent
    tier: major
    weight: 2
    basis: direct
    legal: ["GAID Art 19(6)", "GAID Art 17(9)"]
    decision:
      non_compliant: "Only an Accept control, with no reject mechanism at the same step"
      compliant: "A reject control exists in the banner flow (a settings panel reached without leaving the banner counts)"
      not_applicable: "No consent trigger"
    instance_unit: site
    evidence: [screenshot, control_label]
    edge_cases:
      [
        "A close icon is not Reject (record as Close). 'OK' or 'Got it' is Accept.",
      ]
    remediation:
      fix: "Add a Reject or Decline button to the banner."
      clause: "GAID Art 19(6), 17(9)"

  - id: CN-04
    name: Consent choice is recorded
    category: consent
    tier: minor
    weight: 1
    basis: direct
    legal: ["GAID Art 17(6)", "NDPA s.26(1)"]
    decision:
      non_compliant: "In the Accept run, no persistent consent-state cookie or storage value and no CMP logging request is observed"
      compliant: "A persistent consent-state item or a CMP logging request is observed"
      not_applicable: "No consent trigger, or no consent mechanism (see conventions)"
    instance_unit: site
    evidence: [item_or_request, t_ms]
    edge_cases:
      [
        "Client-observable evidence only. Reports say 'no observable record', never 'no record kept'.",
      ]
    remediation:
      fix: "Make the CMP store the visitor's choice and log it."
      clause: "GAID Art 17(6); NDPA s.26(1)"

  - id: CN-05
    name: Consent can be withdrawn in-site
    category: consent
    tier: major
    weight: 2
    basis: direct
    legal: ["NDPA s.35(1)-(2)", "GAID Art 17(7)(b), 19(7)(e)"]
    decision:
      non_compliant: "After Accept, no in-site control to revisit or change the choice"
      compliant: "A persistent in-site control exists (e.g. a 'Cookie settings' link or CMP widget)"
      not_applicable: "No consent trigger, or no consent mechanism (see conventions)"
    instance_unit: site
    evidence: [control_label, location, screenshot, click_path]
    edge_cases:
      ["Clearing browser cookies manually is not an in-site mechanism"]
    remediation:
      fix: "Add a persistent 'Cookie settings' link in the footer, or enable the CMP's reopen button."
      clause: "NDPA s.35; GAID Art 17(7)(b), 19(7)(e)"

  # ---------------- C. TRACKERS ----------------
  - id: TR-01
    name: Known tracking technologies present (descriptive)
    category: trackers
    tier: unscored
    weight: 0
    basis: descriptive
    legal: ["GAID Art 19(8)", "NDPA s.65 ('online identifier')"]
    decision:
      {
        outcome: "Never scored. Produces the tracker list used by CN-02, TR-02 and SB-01 to SB-03.",
      }
    list_source: "R8: frozen DuckDuckGo blocklist snapshot"
    presumption: "A request to a listed tracker is presumed to carry personal data (online identifier)"
    evidence: [vendor, domain, category, first_seen_ms, run]
    edge_cases:
      [
        "Trackers not in the frozen list are a stated limit, not a claim of exhaustive detection",
      ]

  - id: TR-02
    name: Tracker disclosed by name
    category: trackers
    tier: major
    weight: 2
    basis: direct_stated_reading
    legal: ["GAID Art 19(7)(c)-(d)", "GAID Art 19(7)(a), 19(8)"]
    stated_reading: "'Organisation responsible' = the vendor operating the tracker"
    decision:
      non_compliant: "A detected tracker is not named by vendor or product in the disclosures. A category-only statement does not count (R9)."
      compliant: "Every detected tracker is named"
      not_applicable: "No trackers detected"
    instance_unit: tracker_vendor
    evidence: [vendor, domain, matched_text_or_none, purpose_stated]
    edge_cases: ["A match on any recognised name of the same product counts"]
    remediation:
      fix: "List every tracking vendor by name with its purpose in the cookie policy, or remove the tracker."
      clause: "GAID Art 19(7)(c)-(d), 19(8)"

  # ---------------- D. SCRIPT BEHAVIOUR ----------------
  - id: SB-01
    name: Tracker script active before consent
    category: script_behaviour
    tier: critical
    weight: 1.5 # shares 3 points with SB-03 (overlap pair)
    pair: tracker_pair
    basis: direct
    legal: ["GAID Art 19(2)-(3)", "GAID Art 19(8)"]
    decision:
      non_compliant: "A non-necessary script (a TR-01 tracker, or any script that writes a non-necessary cookie) is active before consent or after Reject. Active = R10."
      compliant: "Consent trigger exists and no such activity"
      not_applicable: "No consent trigger, or scripts are loaded but dormant (record 'dormant')"
    instance_unit: script_origin
    evidence: [script_host, vendor, activity_type, t_ms, run]
    edge_cases:
      [
        "Overlaps with SB-02, SB-03 and CN-02 by design: each isolates a different observable",
      ]
    remediation:
      fix: "Load tracker scripts only after consent: gate the tag on the matching consent category in the tag manager or CMP."
      clause: "GAID Art 19(2)-(3), 19(8)"

  - id: SB-02
    name: Script sets cookie before consent
    category: script_behaviour
    tier: critical
    weight: 1.5 # shares 3 points with CN-02 (overlap pair)
    pair: cookie_pair
    basis: direct
    legal: ["GAID Art 19(2)-(3)"]
    decision:
      non_compliant: "A script sets a non-necessary cookie before consent or after Reject"
      compliant: "Consent trigger exists and no script sets one"
      not_applicable: "No consent trigger, or the only cookies are Necessary"
    attribution: "Names the script that set the cookie. If attribution fails, the tool reports 'unattributed' and the outcome is unable_to_determine."
    instance_unit: script_origin
    evidence: [cookie_name, setting_script, setter_type, t_ms, run]
    remediation:
      fix: "Remove or gate the named script until consent, or move it to the correct consent category."
      clause: "GAID Art 19(2)-(3)"

  - id: SB-03
    name: Request to tracker before consent
    category: script_behaviour
    tier: critical
    weight: 1.5 # shares 3 points with SB-01 (overlap pair)
    pair: tracker_pair
    basis: direct
    legal:
      [
        "GAID Art 19(8)",
        "GAID Sch 1 para 2(v)",
        "GAID Art 26(2)(d) (context only)",
      ]
    decision:
      non_compliant: "Any request to a third-party tracking domain (R8 list) before consent or after Reject"
      compliant: "Consent trigger exists and no such request"
      not_applicable: "No consent trigger. The site's own CDN or infrastructure subprocessors are not trackers."
    instance_unit: tracker_vendor
    evidence:
      [
        request_host,
        method,
        resource_type,
        payload_key_names,
        payload_size,
        t_ms,
        run,
      ]
    edge_cases: ["Key names, sizes and hashes only. Never store raw bodies."]
    remediation:
      fix: "Stop the tag firing before consent. Confirm with a No-action run that no request leaves for the vendor."
      clause: "GAID Art 19(8); Sch 1 para 2(v)"

  # ---------------- E. PRIVACY POLICY ----------------
  - id: PP-01
    name: Privacy policy reachable within two clicks
    category: privacy_policy
    tier: major
    weight: 2
    basis: direct
    legal: ["GAID Art 7(j)-(k)", "NDPA s.27(3)"]
    thresholds:
      {
        max_clicks: 2,
        min_text_chars: 500,
        link_keywords:
          ["privacy policy", "privacy notice", "privacy", "data protection"],
        common_paths:
          [
            "/privacy",
            "/privacy-policy",
            "/privacy-notice",
            "/data-protection",
            "/legal/privacy",
            "/cookie-policy",
          ],
      }
    discovery_status:
      [found_linked, found_unlinked, exhaustive_negative, uncertain]
    decision:
      non_compliant: "No policy reachable within two clicks, the link is broken, or found only by common-path probing"
      compliant: "Policy reachable by links within two clicks"
      not_applicable: "never"
    instance_unit: site
    evidence: [policy_url, click_path, discovery_status, screenshot]
    edge_cases:
      [
        "A policy under its own heading inside the Terms counts as present (R11)",
        "Policy text found by probing still feeds the other PP rules",
      ]
    remediation:
      fix: "Add a 'Privacy Policy' link to the footer of every page, with a working URL."
      clause: "GAID Art 7(j)-(k); NDPA s.27(3)"

  - id: PP-02
    name: Cookie policy or cookie disclosure present
    category: privacy_policy
    tier: major
    weight: 2
    basis: direct
    legal: ["GAID Art 19(7)(b)-(c)"]
    decision:
      non_compliant: "No cookie-specific disclosure anywhere in the disclosures. Banner or panel text counts only if it states both presence and purpose of the cookies."
      compliant: "Standalone cookie policy, headed section, or banner/panel text stating presence and purpose"
      not_applicable: "never"
    instance_unit: site
    evidence: [url_or_heading, standalone_embedded_or_banner_only]
    edge_cases: ["Same embedding rule as PP-01 (R11)"]
    remediation:
      fix: "Publish a cookie policy, or add a headed 'Cookies' section covering what is set and why."
      clause: "GAID Art 19(7)(b)-(c)"

  - id: PP-03
    name: Privacy contact provided
    category: privacy_policy
    tier: minor
    weight: 1
    basis: direct
    legal: ["NDPA s.27(1)(a), 27(3)", "GAID Art 27(3)(i), 11(2), 12(6)"]
    decision:
      non_compliant: "No contact channel specific to privacy or data protection. A generic 'Contact us' or form does not count unless it states it covers privacy (R12)."
      compliant: "A privacy-specific email, form or DPO contact is given"
      not_applicable: "never"
    note: "A named DPO is not required of every controller (NDPA s.32(1)), so absence of a DPO alone is not a failure."
    instance_unit: site
    evidence: [contact_type, quote_short]
    remediation:
      fix: "Add a privacy contact (e.g. dpo@yourdomain) to the policy, labelled for data protection queries."
      clause: "NDPA s.27(1)(a); GAID Art 27(3)(i)"

  - id: PP-04
    name: Purpose of collection disclosed
    category: privacy_policy
    tier: major
    weight: 2
    basis: direct
    legal: ["NDPA s.27(1)(b)", "GAID Art 27(3)(c)-(d)"]
    decision:
      non_compliant: "Data collected is described without stating why, or only vague purposes are given. Minimum bar: name the data category and the specific use (R13)."
      compliant: "At least one statement meets the minimum bar"
      not_applicable: "never"
    instance_unit: site
    evidence: [quote_short, data_category, stated_use]
    remediation:
      fix: "For each type of data you collect, state the specific reason, e.g. 'email address: to send order confirmations'."
      clause: "NDPA s.27(1)(b); GAID Art 27(3)(c)-(d)"

  - id: PP-05
    name: Retention period or criterion disclosed
    category: privacy_policy
    tier: minor
    weight: 1
    basis: direct
    legal: ["NDPA s.27(1)(e)", "GAID Sch 1 para 4(iii),(vii)"]
    decision:
      non_compliant: "No retention period or criterion stated anywhere in the policy"
      compliant: "A duration, or a clear end-trigger the data subject can act on (e.g. 'until you withdraw consent')"
      not_applicable: "never"
    instance_unit: site
    evidence: [quote_short, duration_or_trigger]
    remediation:
      fix: "State how long each category of data is kept, or the event that ends retention."
      clause: "NDPA s.27(1)(e); GAID Sch 1 para 4(vii)"

  - id: PP-06
    name: Data subject rights disclosed
    category: privacy_policy
    tier: major
    weight: 2
    basis: direct
    legal: ["NDPA s.27(1)(d), 34-38, 46", "GAID Art 27(3)(h)"]
    core_rights:
      access: "s.34(1)(a)-(b)"
      rectification: "s.34(1)(c); GAID Art 36"
      erasure: "s.34(1)(d), 34(2); GAID Art 38"
      restriction: "s.34(1)(e)"
      portability: "s.38; GAID Art 37"
      objection: "s.36"
      complaint_to_NDPC: "s.46; s.27(1)(f); GAID Art 27(3)(j), 39"
    recorded_not_scored:
      ["withdraw consent (s.35)", "no solely automated decisions (s.37)"]
    decision:
      non_compliant: "Rights omitted entirely, or any of the seven core rights omitted without a valid explanation"
      compliant: "All seven core rights disclosed, or each omission explained (why the right does not apply)"
      not_applicable: "never"
    instance_unit: site
    evidence: [rights_checklist_7, rights_missing, quote_short]
    edge_cases:
      [
        "Missing only the NDPC complaint right is still non_compliant, flagged as a sub-finding",
      ]
    remediation:
      fix: "Add a 'Your rights' section covering access, correction, deletion, restriction, portability, objection and how to complain to the NDPC."
      clause: "NDPA s.27(1)(d), 34-38, 46; GAID Art 27(3)(h)"

scoring:
  weights: "Each rule's 'weight' field. Pairs: CN-02+SB-02 share 3 points; SB-01+SB-03 share 3 points. Fixed in advance, never tuned."
  expected_total_weight: 28
  formula: "sum(w_i * c_i) / sum(w_i) * 100 over rules with outcome compliant or non_compliant"
  equal_weight_score: "Every rule 1, except paired rules 0.5 each. Total 15. Reported beside the weighted score."
  risk_band:
    high: "Any critical rule non_compliant"
    moderate: "No critical failure, at least one major rule non_compliant"
    low: "Only minor failures, or none"
  coverage:
    definition: "determined weight / 28 (not_applicable counts as determined; unable_to_determine does not)"
    hide_score_below: 0.70
  blocked: "Scan status 'blocked' gives no score and no rule outcomes"
  category_axes: [cookies, consent, trackers, script_behaviour, privacy_policy]
  empty_category: "No applicable rule: plot at 100, hollow marker, label 'Nothing to assess'"
